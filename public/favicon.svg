<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <path id="fav-arc" d="M 11.25,50 A 38.75,38.75 0 0,1 88.75,50" />

    <g id="fav-stars">
      <polygon points="87.2,37.3 87.8,38.6 89.2,38.7 88.1,39.6 88.4,40.9 87.2,40.2 86.1,40.9 86.4,39.6 85.3,38.7 86.7,38.6" />
      <polygon points="88.8,48.0 89.3,49.3 90.7,49.4 89.6,50.3 89.9,51.6 88.8,50.9 87.6,51.6 87.9,50.3 86.8,49.4 88.2,49.3" />
      <polygon points="87.2,58.7 87.8,60.0 89.2,60.1 88.1,61.0 88.4,62.3 87.2,61.6 86.1,62.3 86.4,61.0 85.3,60.1 86.7,60.0" />
    </g>
  </defs>

  <!-- Outer White Badge -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <circle cx="50" cy="50" r="46.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2.5 2" />

  <!-- Inner Gradient Medallion -->
  <circle cx="50" cy="50" r="31" fill="url(#fav-grad)" />

  <!-- Top Arched Text: MULTILINGUAL -->
  <text font-size="6.8" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="0.2em" fill="#0f172a">
    <textPath href="#fav-arc" startOffset="50%" text-anchor="middle">MULTILINGUAL</textPath>
  </text>

  <!-- Bottom Arched Text: MULTILINGUAL -->
  <g transform="rotate(180 50 50)">
    <text font-size="6.8" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="0.2em" fill="#0f172a">
      <textPath href="#fav-arc" startOffset="50%" text-anchor="middle">MULTILINGUAL</textPath>
    </text>
  </g>

  <!-- Lateral Stars -->
  <use href="#fav-stars" fill="#059669" />
  <use href="#fav-stars" fill="#059669" transform="rotate(180 50 50)" />

  <!-- Speech Bubble 1: White with character 文 -->
  <path
    d="M 41,31 A 10,10 0 0,1 51,41 A 10,10 0 0,1 42.5,50.8 L 32,54 L 35.5,47.5 A 10,10 0 0,1 31,41 A 10,10 0 0,1 41,31 Z"
    fill="#ffffff"
  />
  <text x="41" y="41.2" text-anchor="middle" dominant-baseline="central" fill="#059669" font-size="11.5" font-weight="900" font-family="system-ui, sans-serif">文</text>

  <!-- Speech Bubble 2: Outlined with Latin letter A -->
  <path
    d="M 57,41 A 10,10 0 0,1 67,51 A 10,10 0 0,1 64.5,57.5 L 68,64 L 58.5,60.8 A 10,10 0 0,1 47,51 A 10,10 0 0,1 57,41 Z"
    fill="url(#fav-grad)"
    stroke="#ffffff"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <text x="57" y="51" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12.5" font-weight="900" font-family="system-ui, sans-serif">A</text>
</svg>
